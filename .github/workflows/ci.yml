name: EduTask CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build, Lint & Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Ambiente Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Instalar Dependências do Projeto
        run: |
          python -m pip install --upgrade pip
          pip install -r 01_SISTEMA_ALVO/requirements.txt

      - name: Executar Análise Estática de Código (Flake8)
        run: |
          python -m flake8 01_SISTEMA_ALVO/edutask --config=01_SISTEMA_ALVO/.flake8 --exit-zero

      - name: Executar Testes Unitários Automatizados (Pytest)
        run: |
          cd 07_AUTOMACAO_UNITARIA
          pytest -v test_unitarios.py

      - name: Executar Testes de Integração e API
        run: |
          cd 08_INTEGRACAO_API
          pytest -v test_api_integracao.py

      - name: Publicar Resumo da Execução dos Testes
        if: always()
        run: |
          echo "Pipeline concluído com sucesso em $(date)" >> $GITHUB_STEP_SUMMARY
