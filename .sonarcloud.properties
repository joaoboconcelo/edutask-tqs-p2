# Escopo da análise do SonarQube Cloud (análise automática).
# Código-fonte analisado: sistema, testes automatizados e scripts de apoio.
sonar.sources=.
# Evidências de execução (HTML/JSON/XML salvos das telas e logs) não são código
# do sistema e ficam fora da análise e do cálculo de duplicação.
sonar.exclusions=**/evidencias/**,**/evidencias_*/**,**/*.docx,**/*.pdf,**/*.xlsx,**/*.zip
sonar.python.version=3.13
