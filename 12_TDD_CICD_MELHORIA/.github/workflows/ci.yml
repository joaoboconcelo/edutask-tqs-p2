name: EduTask CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, Lint & Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Ambiente Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Instalar Dependências do Projeto
        run: |
          python -m pip install --upgrade pip
          pip install -r 01_SISTEMA_ALVO/requirements.txt

      - name: Executar Análise Estática de Código (Flake8)
        run: |
          mkdir -p 11_METRICAS_E_QUALIDADE/evidencias
          python -m flake8 01_SISTEMA_ALVO/edutask --config=01_SISTEMA_ALVO/.flake8

      - name: Executar Testes Unitários Automatizados (Pytest)
        run: |
          mkdir -p 07_AUTOMACAO_UNITARIA/evidencias
          pytest -v 07_AUTOMACAO_UNITARIA --junitxml=07_AUTOMACAO_UNITARIA/evidencias/unitarios.xml

      - name: Executar Testes de Integração e API
        run: |
          mkdir -p 08_INTEGRACAO_API/evidencias
          pytest -v 08_INTEGRACAO_API 05_EXECUCAO_MANUAL/test_reexecucao_catalogo.py 10_ACEITACAO_NAO_FUNCIONAIS --junitxml=08_INTEGRACAO_API/evidencias/integracao_catalogo.xml

      - name: Executar Interface no Chrome
        run: |
          pytest -v 09_SISTEMA_INTERFACE --junitxml=09_SISTEMA_INTERFACE/evidencias/selenium.xml

      - name: Preservar Evidências
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-de-testes
          path: |
            05_EXECUCAO_MANUAL/evidencias_reexecucao/
            07_AUTOMACAO_UNITARIA/evidencias/
            08_INTEGRACAO_API/evidencias/
            09_SISTEMA_INTERFACE/evidencias/

      - name: Publicar Resumo da Execução dos Testes
        if: always()
        run: |
          echo "Resultado do job: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
